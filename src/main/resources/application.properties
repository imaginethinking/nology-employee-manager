spring.application.name=employeemanager

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotEcist=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.dialect=org.hibernate.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.location=classpath:db/migrations
spring.profiles.active=${SPRING_PROFILE}
app.jwt.secret=${JWT_SECRET}
